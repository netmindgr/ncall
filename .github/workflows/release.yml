name: release

# Official release packages: built here from the public source, signed through SignPath
# (only for version tags, when the SIGNPATH_ORGANIZATION_ID variable is set) and attached to a
# draft GitHub release. Pull requests and branch runs build and package without signing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.ps1
      - scripts/prepare-dependencies.ps1
      - installer.iss
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  # Build provenance attestations (Sigstore) for the published files.
  id-token: write
  attestations: write

jobs:
  package:
    # Pinned image: v143 toolset and Windows SDK 10.0.26100 must stay available.
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      # No binary cache: the source archive needs the dependency source trees of a real build.
      VCPKG_BINARY_SOURCES: clear
      # Signing requests go to manual approval, so only version tags submit them.
      SIGN: ${{ github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'version-string'
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare dependencies
        shell: pwsh
        run: ./scripts/prepare-dependencies.ps1

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Upload unsigned program files
        id: binaries
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ncall-binaries-unsigned
          path: |
            build/Win32/Release/ncall.exe
            build/Win32/Release/netmind.ui.dll

      - name: Sign program files
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ncall
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.binaries.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: release-ncall/signed/binaries

      - name: Use signed program files
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item release-ncall/signed/binaries/ncall.exe, release-ncall/signed/binaries/netmind.ui.dll build/Win32/Release/ -Force

      - name: Package
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          ./scripts/package.ps1 -VcpkgRoot .dependencies/vcpkg -ISCCPath $iscc

      - name: Upload unsigned installer
        id: setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ncall-setup-unsigned
          path: installer/ncall-${{ steps.version.outputs.version }}-setup.exe

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ncall
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: release-ncall/signed/setup

      - name: Use signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $name = 'ncall-${{ steps.version.outputs.version }}-setup.exe'
          Copy-Item "release-ncall/signed/setup/$name" installer/ -Force
          Copy-Item "release-ncall/signed/setup/$name" installer/ncall-setup.exe -Force
          ./scripts/package.ps1 -ChecksumsOnly
          foreach ($file in "installer/$name", 'build/Win32/Release/ncall.exe', 'build/Win32/Release/netmind.ui.dll') {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') { throw "$file is not signed: $($signature.Status)" }
            "$file signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ncall-${{ steps.version.outputs.version }}
          path: |
            installer/ncall-setup.exe
            installer/ncall-${{ steps.version.outputs.version }}-setup.exe
            ncall-${{ steps.version.outputs.version }}-portable.zip
            ncall-${{ steps.version.outputs.version }}-source.zip
            ncall-${{ steps.version.outputs.version }}-SHA256SUMS.txt
            latest.json

      # Anyone can check a download with: gh attestation verify <file> --repo netmindgr/ncall
      - name: Attest build provenance
        if: github.ref_type == 'tag' && github.repository == 'netmindgr/ncall'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            installer/ncall-setup.exe
            installer/ncall-${{ steps.version.outputs.version }}-setup.exe
            ncall-${{ steps.version.outputs.version }}-portable.zip
            ncall-${{ steps.version.outputs.version }}-source.zip

      - name: Draft release
        if: github.ref_type == 'tag' && github.repository == 'netmindgr/ncall'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          gh release create "v$v" --draft --title "nCall $v" --notes "Σημειώσεις έκδοσης: βλ. CHANGELOG.md." `
            installer/ncall-setup.exe "installer/ncall-$v-setup.exe" "ncall-$v-portable.zip" "ncall-$v-source.zip" "ncall-$v-SHA256SUMS.txt" latest.json
